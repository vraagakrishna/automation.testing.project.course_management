name: Mobile Automation Matrix
on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch to run tests on'
        required: true
        default: 'main'

  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'

  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  mobile-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          #- platform_name: Android
          #  execution_type: mobileWeb
          #  os: ubuntu-latest
          #  name: Android-Web
          - platform_name: Android
            execution_type: nativeApp
            os: ubuntu-latest
            name: Android-Native
          #- platform_name: iOS
          #  execution_type: mobileWeb
          #  os: macos-13
          #  name: iOS-Web

    runs-on: ${{ matrix.os }}

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch_name }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Install Node.js & Appium
        run: |
          npm install -g appium
          # Only install the driver needed for the current platform to save setup time
          if [ "${{ matrix.platform_name }}" = "Android" ]; then
            appium driver install uiautomator2
          else
            appium driver install xcuitest
          fi

      # --- FIX KVM PERMISSIONS (Linux Only) ---
      - name: Enable KVM group perms
        if: matrix.platform_name == 'Android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # --- LOGIC FOR ANDROID ---
      - name: Run Android Tests (${{ matrix.execution_type }})
        if: matrix.platform_name == 'Android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -noaudio -no-boot-anim
          script: |
            # Ensure the device is recognized
            echo "Checking connected devices..."
            adb devices
            
            # Wait for device to be fully usable (extra safety)
            adb wait-for-device
            
            mvn clean test -DPLATFORM_NAME=${{ matrix.platform_name }} -DEXECUTION_TYPE=${{ matrix.execution_type }} -DADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }} -DADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }} -DUSER_EMAIL=${{ secrets.USER_EMAIL }} -DUSER_PASSWORD=${{ secrets.USER_PASSWORD }}

      # --- LOGIC FOR iOS ---
      - name: Run iOS Tests (${{ matrix.execution_type }})
        if: matrix.platform_name == 'iOS'
        run: |
          # Booting the simulator
          UDID=$(xcrun simctl list devices | grep -m 1 "iPhone 15" | awk -F '[()]' '{print $2}')
          xcrun simctl boot $UDID
          xcrun simctl waitstarted $UDID

          mvn clean test -DPLATFORM_NAME=${{ matrix.platform_name }} -DEXECUTION_TYPE=${{ matrix.execution_type }} -DADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }} -DADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }} -DUSER_EMAIL=${{ secrets.USER_EMAIL }} -DUSER_PASSWORD=${{ secrets.USER_PASSWORD }}

      # --- SHARED REPORTING ---
      - name: Upload Test Report (${{ matrix.name }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Reports-${{ matrix.name }}
          path: ./Reports/
          if-no-files-found: warn
